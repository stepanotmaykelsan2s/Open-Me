<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Mj</title>
    <!-- Importing Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            /* Rich, deep mixed colors of red, pink, and purple */
            background: linear-gradient(135deg, #ff4b72 0%, #e056fd 40%, #686de0 100%);
            background-size: 200% 200%;
            animation: bgGradient 12s ease infinite;
            font-family: 'Playfair Display', serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        @keyframes bgGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Magical background glow effects */
        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 70%);
            animation: floatOrb 8s ease-in-out infinite alternate;
        }
        @keyframes floatOrb {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        /* Floating Hearts */
        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
            animation: floatUp 8s linear infinite;
            bottom: -50px;
            z-index: 2;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        /* Click Sparkle Effect */
        .click-sparkle {
            position: absolute;
            pointer-events: none;
            font-size: 16px;
            z-index: 999;
            animation: popOut 0.6s ease-out forwards;
        }
        @keyframes popOut {
            0% { transform: scale(0.5) translate(0, 0); opacity: 1; }
            100% { transform: scale(1.5) translate(var(--x), var(--y)); opacity: 0; }
        }

        /* --- MAIN CONTAINER --- */
        .container {
            position: relative;
            width: 90vw;
            max-width: 360px;
            height: 550px;
            z-index: 10;
            perspective: 1500px;
        }

        /* --- ENVELOPE WRAPPER --- */
        .envelope-wrapper {
            position: absolute;
            width: 100%;
            height: 260px;
            bottom: 50px;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.3)); 
        }

        .envelope-wrapper:hover {
            transform: translateY(-5px) scale(1.02);
        }
        
        .envelope-wrapper:active {
            transform: scale(0.98);
        }

        /* The Envelope Body - Realistic Dark Denim Texture */
        .envelope {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #1e1e24;
            background-image: 
                repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 4px),
                repeating-linear-gradient(-45deg, rgba(0,0,0,0.2) 0px, rgba(0,0,0,0.2) 2px, transparent 2px, transparent 4px),
                linear-gradient(to bottom, #2a2a35, #15151a);
            border-radius: 6px;
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.8),
                inset 0 2px 2px rgba(255,255,255,0.1);
            
            /* Stitching Border Effect */
            border: 2px dashed rgba(255, 255, 255, 0.15);
        }

        /* The Flap */
        .envelope-flap {
            position: absolute;
            top: -2px;
            left: -2px;
            width: 0;
            height: 0;
            border-left: 182px solid transparent;
            border-right: 182px solid transparent;
            border-top: 145px solid #25252d;
            transform-origin: top;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.2s;
            z-index: 30;
            border-radius: 6px;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.4)); 
            
            /* Stitching on flap */
            background-image: linear-gradient(to right, transparent 48%, rgba(255,255,255,0.1) 49%, rgba(255,255,255,0.1) 51%, transparent 52%);
        }

        /* Wax Seal */
        .wax-seal {
            position: absolute;
            top: 125px;
            left: 50%;
            transform: translateX(-50%);
            width: 44px;
            height: 44px;
            background: radial-gradient(circle at 30% 30%, #ff4b72, #8b0020);
            border-radius: 50%;
            z-index: 35;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset 0 2px 4px rgba(255,255,255,0.4);
            transition: opacity 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255,255,255,0.8);
            font-family: 'Dancing Script', cursive;
            font-size: 22px;
        }

        /* Inner pocket */
        .envelope-pocket {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 130px;
            background-color: #18181d;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 4px);
            z-index: 25;
            clip-path: polygon(0 35%, 50% 0, 100% 35%, 100% 100%, 0% 100%);
            border-radius: 0 0 6px 6px;
            box-shadow: inset 0 10px 15px rgba(0,0,0,0.6);
        }

        /* Subtle "To: Mj" on the envelope */
        .to-text {
            position: absolute;
            bottom: 50px;
            width: 100%;
            text-align: center;
            font-family: 'Dancing Script', cursive;
            font-size: 26px;
            color: rgba(255, 255, 255, 0.3);
            z-index: 26;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        /* Floating "Open Me" Button */
        .open-me {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            padding: 8px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-family: 'Permanent Marker', cursive;
            font-size: 18px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            animation: floatBob 2s ease-in-out infinite;
            pointer-events: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            white-space: nowrap;
        }

        @keyframes floatBob {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, -10px); }
        }

        /* --- VINTAGE LETTER DESIGN --- */
        .letter {
            position: absolute;
            width: 92%;
            height: 380px; /* Adjusted height so it stays hidden */
            background-color: #fdf5e6; 
            left: 4%;
            bottom: 30px;
            border-radius: 3px;
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.3), 
                inset 0 0 40px rgba(139, 69, 19, 0.1); 
            z-index: 15; /* Lower than the flap and pocket */
            padding: 30px 25px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            
            /* Paper Texture, Lines, and Coffee Stain Effect */
            background-image: 
                linear-gradient(rgba(139, 69, 19, 0.15) 1px, transparent 1px),
                radial-gradient(circle at 80% 80%, rgba(160, 82, 45, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 20% 30%, rgba(0,0,0,0.03) 1px, transparent 1px);
            background-size: 100% 28px, 100% 100%, 4px 4px;
            
            transition: transform 1.4s cubic-bezier(0.25, 1, 0.3, 1);
            transform: translateY(0);
        }

        /* Torn edge effect */
        .letter::before {
            content: "";
            position: absolute;
            top: -3px;
            left: 0;
            width: 100%;
            height: 6px;
            background: #fdf5e6;
            clip-path: polygon(0% 100%, 2% 40%, 5% 80%, 8% 30%, 12% 70%, 15% 20%, 20% 80%, 25% 40%, 30% 90%, 35% 30%, 40% 80%, 45% 20%, 50% 70%, 55% 30%, 60% 80%, 65% 20%, 70% 90%, 75% 30%, 80% 80%, 85% 40%, 90% 90%, 95% 30%, 98% 80%, 100% 100%);
        }

        /* Vintage Postage Stamp */
        .stamp {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 45px;
            height: 55px;
            background-color: #e8d5c4;
            border: 2px dashed #c4a48f;
            border-radius: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Dancing Script', cursive;
            color: #c4a48f;
            font-size: 14px;
            transform: rotate(8deg);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            opacity: 0.8;
        }

        .letter-content {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.8s ease 0.6s, transform 0.8s ease 0.6s;
            width: 100%;
            margin-top: 20px;
        }

        .letter h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 30px;
            color: #5a4a42;
            margin-bottom: 5px;
            text-align: left;
            padding-left: 10px;
        }

        .letter h1 {
            font-family: 'Permanent Marker', cursive;
            color: #3b3b4f; 
            font-size: 32px;
            line-height: 1.2;
            margin-bottom: 20px;
            transform: rotate(-2deg);
            text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
        }

        .letter p {
            font-size: 15px;
            color: #444;
            font-style: italic;
            line-height: 1.6;
            max-width: 95%;
            margin: 0 auto;
            text-align: left;
            padding-left: 10px;
        }

        /* Signature */
        .signature {
            font-family: 'Dancing Script', cursive;
            font-size: 26px;
            color: #5a4a42;
            text-align: right;
            width: 90%;
            margin-top: 15px;
            transform: rotate(-3deg);
            opacity: 0.85;
        }

        /* --- INTERACTIVE "P.S." BUTTON --- */
        .ps-btn {
            margin-top: 15px;
            background: rgba(139, 69, 19, 0.1);
            border: 1px solid rgba(139, 69, 19, 0.3);
            color: #8b4513;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Playfair Display', serif;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .ps-btn:hover {
            background: rgba(139, 69, 19, 0.2);
        }

        /* The hidden message */
        .hidden-msg {
            margin-top: 10px;
            font-family: 'Dancing Script', cursive;
            font-size: 20px;
            color: #d35400;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.5s ease;
        }

        .hidden-msg.show {
            max-height: 100px;
            opacity: 1;
            margin-top: 10px;
        }

        /* --- ANIMATION STATES (When Opened) --- */
        .container.opened .letter {
            transform: translateY(-220px) scale(1.02); /* Moves higher up */
            z-index: 40;
        }

        .container.opened .letter-content {
            opacity: 1;
            transform: translateY(0);
        }

        .container.opened .ps-btn {
            opacity: 1;
            pointer-events: auto;
            transition-delay: 1.2s;
        }

        .container.opened .envelope-flap {
            transform: rotateX(180deg);
            z-index: 10;
        }

        .container.opened .wax-seal {
            opacity: 0;
        }

        .container.opened .open-me {
            opacity: 0;
            transform: translate(-50%, 20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        
        .container.opened .envelope-wrapper {
            transform: translateY(30px);
        }

    </style>
</head>
<body>

    <!-- Background Effects -->
    <div class="bg-glow" id="bg-glow"></div>

    <div class="container" id="main-container">
        
        <!-- The Vintage Letter -->
        <div class="letter">
            <div class="stamp">M</div>
            <div class="letter-content">
                <h2>Dearest Mj,</h2>
                <h1>Goodluck on Your Exams!!</h1>
                <p>Hello!!, sorry i was silent for a while kasi ginagawa koto AHHAHAHHA, But i just want to Cheer you up😘</p>
                
                <div class="signature">From: Ron</div>

                <button class="ps-btn" id="ps-btn" onclick="revealSecret(event)">P.S. Click Here</button>
                <div class="hidden-msg" id="hidden-msg">
                    I believe in you always! You've got this. 🤍
                </div>
            </div>
        </div>

        <!-- The Envelope -->
        <div class="envelope-wrapper" id="envelope-wrapper" onclick="openEnvelope(event)">
            <div class="open-me">Open Me</div>
            <div class="envelope">
                <div class="envelope-flap">
                    <div class="wax-seal">M</div>
                </div>
                <div class="envelope-pocket">
                    <div class="to-text">To: Mj</div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- Background Effects ---
        const bgGlow = document.getElementById('bg-glow');
        
        for (let i = 0; i < 5; i++) {
            const orb = document.createElement('div');
            orb.classList.add('glow-orb');
            orb.style.width = (Math.random() * 200 + 100) + 'px';
            orb.style.height = orb.style.width;
            orb.style.left = (Math.random() * 100) + 'vw';
            orb.style.top = (Math.random() * 100) + 'vh';
            orb.style.animationDelay = (Math.random() * 5) + 's';
            bgGlow.appendChild(orb);
        }

        const symbols = ['♥', '✨', '🌸']; 
        for (let i = 0; i < 20; i++) {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 4 + 6) + 's'; 
            heart.style.animationDelay = Math.random() * 5 + 's';
            heart.style.fontSize = (Math.random() * 15 + 15) + 'px'; 
            bgGlow.appendChild(heart);
        }

        // --- Click Sparkle Effect ---
        function createSparkles(e) {
            const sparkleSymbols = ['✨', '🌟', '♥'];
            for (let i = 0; i < 6; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('click-sparkle');
                sparkle.innerText = sparkleSymbols[Math.floor(Math.random() * sparkleSymbols.length)];
                
                sparkle.style.left = e.clientX + 'px';
                sparkle.style.top = e.clientY + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 60 + 20;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                sparkle.style.setProperty('--x', tx + 'px');
                sparkle.style.setProperty('--y', ty + 'px');
                
                document.body.appendChild(sparkle);
                
                setTimeout(() => {
                    sparkle.remove();
                }, 600);
            }
        }

        // --- Interactions ---
        let isOpened = false;
        
        function openEnvelope(e) {
            createSparkles(e); 

            if (isOpened) return;
            isOpened = true;
            
            const container = document.getElementById('main-container');
            container.classList.add('opened');
        }

        function revealSecret(e) {
            e.stopPropagation(); 
            createSparkles(e); 
            
            const hiddenMsg = document.getElementById('hidden-msg');
            const btn = document.getElementById('ps-btn');
            
            hiddenMsg.classList.add('show');
            btn.style.opacity = '0'; 
            
            setTimeout(() => {
                btn.style.display = 'none';
            }, 300);
        }
    </script>
</body>
</html>
